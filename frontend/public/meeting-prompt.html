<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motiv</title>
<!-- Motiv: meeting awareness popup. Standalone on purpose: the main app
     layout registers recording listeners that must exist only once.
     The window is transparent; this page draws the rounded card. -->
<style>
  :root {
    color-scheme: light dark;
    --card: rgba(255, 255, 255, 0.96); --fg: #0f172a; --muted: #64748b; --ring: rgba(15, 23, 42, 0.08);
    --btn: rgba(15, 23, 42, 0.06); --btn-hover: rgba(15, 23, 42, 0.1);
    --primary: #5b4ee8; --primary-hover: #4c3fd6; --rec: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root { --card: rgba(30, 32, 44, 0.96); --fg: #f8fafc; --muted: #94a3b8; --ring: rgba(255, 255, 255, 0.08);
      --btn: rgba(255, 255, 255, 0.08); --btn-hover: rgba(255, 255, 255, 0.14); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  body { padding: 6px; }
  .card {
    height: 100%; border-radius: 18px; background: var(--card); color: var(--fg);
    box-shadow: 0 0 0 1px var(--ring), 0 2px 6px rgba(15, 23, 42, 0.12);
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    padding: 16px 16px 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    animation: in 220ms cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes in { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: 12px; min-width: 0; padding-right: 26px; }
  .logo { position: relative; flex: none; width: 40px; height: 40px; }
  .logo img { width: 40px; height: 40px; border-radius: 10px; display: block; }
  .live { position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--rec); box-shadow: 0 0 0 2px var(--card); animation: pulse 1.6s ease-in-out infinite; }
  .ended .live { display: none; }
  @keyframes pulse { 50% { opacity: .45; } }
  .text { min-width: 0; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.3; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; font-weight: 500; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    background: var(--btn); color: var(--fg); transition: background 120ms ease, transform 80ms ease; }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  button.primary:hover { background: var(--primary-hover); }
  button.link { background: none; color: var(--muted); padding: 7px 6px; margin-right: auto; }
  button.link:hover { color: var(--fg); background: none; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .close { position: absolute; top: 18px; right: 22px; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    background: transparent; color: var(--muted); font-size: 16px; line-height: 24px; text-align: center; }
  .close:hover { background: var(--btn); color: var(--fg); }
</style>
</head>
<body>
  <div class="card" id="card" data-tauri-drag-region>
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="head" data-tauri-drag-region>
      <div class="logo" aria-hidden="true"><img src="icon_128x128.png" alt=""><span class="live"></span></div>
      <div class="text" data-tauri-drag-region>
        <div class="title" id="title"></div>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="row">
      <button class="link" id="never"></button>
      <button id="dismiss"></button>
      <button class="primary" id="go"></button>
    </div>
  </div>
<script src="meeting-prompt.js"></script>
</body>
</html>
