<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motiv</title>
<!-- Motiv: meeting awareness popup. Standalone on purpose: the main app
     layout registers recording listeners that must exist only once. -->
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #111827; --muted: #6b7280; --border: #e5e7eb; --primary: #2563eb; --primary-fg: #fff; --btn: #f3f4f6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f2937; --fg: #f9fafb; --muted: #9ca3af; --border: #374151; --btn: #374151; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; flex: none; }
  .title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; }
  button { font: inherit; border: 0; border-radius: 6px; padding: 6px 12px; background: var(--btn); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
  button.link { background: none; color: var(--muted); padding: 6px 4px; margin-right: auto; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
</style>
</head>
<body data-tauri-drag-region>
  <div class="head" data-tauri-drag-region>
    <span class="dot" aria-hidden="true"></span>
    <div style="min-width:0" data-tauri-drag-region>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="row">
    <button class="link" id="never"></button>
    <button id="dismiss"></button>
    <button class="primary" id="go"></button>
  </div>
<script src="meeting-prompt.js"></script>
</body>
</html>
